<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Cocos Playable Packer 使用流程</title>
  <desc id="desc">从 Cocos Creator 构建 Web Mobile，到配置插件、生成并预览单文件 HTML 的五步流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102036"/><stop offset="1" stop-color="#162f4d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="70" y="70" fill="#f8fafc" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">Cocos Playable Packer · 使用流程</text>
  <text x="70" y="105" fill="#a9c2da" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17">在 Creator 内完成 Web Mobile 构建、压缩、单文件导出与试玩验证</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <g transform="translate(70 155)"><rect width="188" height="130" rx="16" fill="#1e3a5f" stroke="#3f638b"/><circle cx="32" cy="32" r="18" fill="url(#accent)"/><text x="32" y="38" text-anchor="middle" fill="white" font-size="17" font-weight="700">1</text><text x="22" y="78" fill="#f8fafc" font-size="20" font-weight="700">构建 Web Mobile</text><text x="22" y="106" fill="#b8cee2" font-size="15">生成 build/web-mobile</text></g>
    <path d="M270 220H298" stroke="#60a5fa" stroke-width="3"/><path d="M292 213l10 7-10 7" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <g transform="translate(310 155)"><rect width="188" height="130" rx="16" fill="#1e3a5f" stroke="#3f638b"/><circle cx="32" cy="32" r="18" fill="url(#accent)"/><text x="32" y="38" text-anchor="middle" fill="white" font-size="17" font-weight="700">2</text><text x="22" y="78" fill="#f8fafc" font-size="20" font-weight="700">打开插件面板</text><text x="22" y="106" fill="#b8cee2" font-size="15">检查环境状态</text></g>
    <path d="M510 220H538" stroke="#60a5fa" stroke-width="3"/><path d="M532 213l10 7-10 7" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <g transform="translate(550 155)"><rect width="188" height="130" rx="16" fill="#1e3a5f" stroke="#3f638b"/><circle cx="32" cy="32" r="18" fill="url(#accent)"/><text x="32" y="38" text-anchor="middle" fill="white" font-size="17" font-weight="700">3</text><text x="22" y="78" fill="#f8fafc" font-size="20" font-weight="700">配置压缩策略</text><text x="22" y="106" fill="#b8cee2" font-size="15">图片、音频与加载页</text></g>
    <path d="M750 220H778" stroke="#60a5fa" stroke-width="3"/><path d="M772 213l10 7-10 7" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <g transform="translate(790 155)"><rect width="188" height="130" rx="16" fill="#1e3a5f" stroke="#3f638b"/><circle cx="32" cy="32" r="18" fill="url(#accent)"/><text x="32" y="38" text-anchor="middle" fill="white" font-size="17" font-weight="700">4</text><text x="22" y="78" fill="#f8fafc" font-size="20" font-weight="700">生成单文件</text><text x="22" y="106" fill="#b8cee2" font-size="15">输出 Playable HTML</text></g>
    <path d="M990 220H1018" stroke="#60a5fa" stroke-width="3"/><path d="M1012 213l10 7-10 7" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <g transform="translate(1030 155)"><rect width="100" height="130" rx="16" fill="#1e3a5f" stroke="#3f638b"/><circle cx="32" cy="32" r="18" fill="url(#accent)"/><text x="32" y="38" text-anchor="middle" fill="white" font-size="17" font-weight="700">5</text><text x="22" y="78" fill="#f8fafc" font-size="18" font-weight="700">预览</text><text x="22" y="104" fill="#b8cee2" font-size="14">验证</text></g>
  </g>
</svg>
